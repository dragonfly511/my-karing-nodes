name: convert

on:
  push:
    paths:
      - ulinks.txt
      - convert.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert
        run: python3 convert.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nodes.txt subscription.txt subscription.json
          git diff --cached --quiet || git commit -m "update subscription"
          git push
